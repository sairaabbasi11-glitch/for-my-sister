<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome — A little book for my sister</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <main class="login-page">
    <form class="login-box" id="login-form">
      <h1>Hello, <span class="sister-name">Sister</span>!</h1>
      <p>This little book is just for you. Enter the secret words to open it.</p>

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="btn" type="submit">Open my book</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
